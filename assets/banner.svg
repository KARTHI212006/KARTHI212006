<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Karthikeyan S — Java Full Stack Developer</title>
  <desc id="d">Profile banner: Karthikeyan S, Java Full Stack Developer, Code, Create, Innovate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc143c"/>
      <stop offset="0.6" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 40) rotate(90) scale(260 420)">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 300) rotate(90) scale(220 380)">
      <stop offset="0" stop-color="#dc143c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>
  <rect width="1280" height="320" fill="url(#glowL)"/>

  <!-- subtle grid -->
  <g stroke="#30363d" stroke-opacity="0.35" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M320 0V320M640 0V320M960 0V320"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="86" width="6" height="148" rx="3" fill="url(#bar)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="112" y="150" font-size="68" font-weight="700" fill="#f0f6fc" letter-spacing="1">Karthikeyan S</text>
    <text x="114" y="195" font-size="30" font-weight="600" fill="#dc143c" letter-spacing="3">JAVA FULL STACK DEVELOPER</text>
    <text x="114" y="235" font-size="22" fill="#8b949e" letter-spacing="2">Code  •  Create  •  Innovate</text>
  </g>

  <!-- code-bracket motif -->
  <g font-family="'Consolas', 'Courier New', monospace" font-weight="700" fill="none">
    <text x="890" y="205" font-size="150" fill="#2f81f7" fill-opacity="0.85">{</text>
    <text x="1110" y="205" font-size="150" fill="#dc143c" fill-opacity="0.85">}</text>
    <text x="1050" y="188" font-size="60" fill="#8957e5" fill-opacity="0.9" text-anchor="middle">/&gt;</text>
  </g>

  <rect y="316" width="1280" height="4" fill="url(#bar)"/>
</svg>
